<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Book</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- APP -->
  <div id="app-screen" class="screen active">

    <header class="site-header">
      <div class="header-inner">
        <div class="header-brand">
          <span class="brand-crest">✦</span>
          <span class="brand-name">Recipe Book</span>
        </div>
        <div class="header-controls">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l3.5 3.5" stroke-linecap="round"/></svg>
            <input type="search" id="search-input" class="search-input" placeholder="Search recipes…" />
          </div>

        </div>
      </div>
    </header>

    <main class="main-content">
      <div id="filter-bar" class="filter-bar hidden">
        <button class="filter-pill active" data-category="all">All</button>
      </div>
      <div id="loading-state" class="loading-state">
        <div class="spinner"></div>
        <p>Fetching recipes…</p>
      </div>
      <div id="error-state" class="empty-state hidden">
        <span class="empty-icon">⚠</span>
        <p id="error-message">Something went wrong.</p>
      </div>
      <div id="empty-state" class="empty-state hidden">
        <span class="empty-icon">✦</span>
        <p>No recipes found.</p>
      </div>
      <div id="recipe-grid" class="recipe-grid hidden"></div>
    </main>

  </div>

  <!-- MODAL -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <button id="modal-close" class="modal-close" aria-label="Close">✕</button>
      <div id="modal-hero" class="modal-hero">
        <div id="modal-emoji" class="modal-emoji"></div>
      </div>
      <div class="modal-body">
        <div class="modal-meta-top">
          <span id="modal-category" class="modal-category-tag"></span>
        </div>
        <h2 id="modal-title" class="modal-title"></h2>
        <p id="modal-description" class="modal-description"></p>
        <div class="modal-stats">
          <div class="stat-item">
            <span class="stat-label">Prep</span>
            <span class="stat-value" id="modal-prep"></span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-label">Cook</span>
            <span class="stat-value" id="modal-cook"></span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-label">Serves</span>
            <span class="stat-value" id="modal-servings"></span>
          </div>
        </div>
        <div class="modal-section">
          <h3 class="section-heading">Ingredients</h3>
          <ul id="modal-ingredients" class="ingredients-list"></ul>
        </div>
        <div class="modal-section">
          <h3 class="section-heading">Method</h3>
          <ol id="modal-steps" class="steps-list"></ol>
        </div>
        <div id="modal-notes-wrap" class="modal-section hidden">
          <h3 class="section-heading">Notes</h3>
          <p id="modal-notes" class="modal-notes-text"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
